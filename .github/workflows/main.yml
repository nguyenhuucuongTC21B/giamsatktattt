name: Build BCY-VKS

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify project structure
        shell: pwsh
        run: |
          Write-Host "=== Project root contents ==="
          Get-ChildItem -Force | Format-Table Name,Length,Mode
          Write-Host ""
          Write-Host "=== internal/ contents ==="
          Get-ChildItem -Path internal -Recurse -ErrorAction SilentlyContinue | Format-Table FullName

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Go environment variables
        shell: pwsh
        run: |
          # Set GOPATH explicitly (GitHub Actions windows-latest may not set it)
          if (-not $env:GOPATH) {
            $env:GOPATH = Join-Path $env:USERPROFILE "go"
            Write-Host "GOPATH was not set. Setting to: $env:GOPATH"
          }
          
          # Add GOPATH/bin to PATH so we can call wails directly
          $gopathBin = Join-Path $env:GOPATH "bin"
          if (-not ($env:PATH -split ";" -contains $gopathBin)) {
            $env:PATH = "$gopathBin;$env:PATH"
          }
          
          # Export to GITHUB_ENV for subsequent steps
          "GOPATH=$env:GOPATH" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PATH=$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          
          Write-Host "GOPATH: $env:GOPATH"
          Write-Host "GOROOT: $env:GOROOT"
          Write-Host "PATH (first 200 chars): $($env:PATH.Substring(0, [math]::Min(200, $env:PATH.Length)))"
          go env GOPATH GOROOT GOMODCACHE CGO_ENABLED
          go version

      - name: Install Wails CLI
        shell: pwsh
        run: |
          # Make sure GOPATH is set
          if (-not $env:GOPATH) {
            $env:GOPATH = Join-Path $env:USERPROFILE "go"
          }
          $gopathBin = Join-Path $env:GOPATH "bin"
          New-Item -ItemType Directory -Path $gopathBin -Force | Out-Null
          
          Write-Host "Installing Wails CLI..."
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          Write-Host "Install exit code: $LASTEXITCODE"
          
          $wailsPath = Join-Path $gopathBin "wails.exe"
          Write-Host "Looking for wails.exe at: $wailsPath"
          
          if (Test-Path $wailsPath) {
            Write-Host "wails.exe found"
            & $wailsPath version
          } else {
            Write-Host "ERROR: wails.exe NOT found at $wailsPath"
            Write-Host "Listing $gopathBin contents:"
            Get-ChildItem -Path $gopathBin -ErrorAction SilentlyContinue | Format-Table Name
            exit 1
          }

      - name: Download Go dependencies
        shell: pwsh
        run: |
          go mod download
          go mod verify

      - name: Run go vet
        shell: pwsh
        run: go vet ./...

      - name: Build BCY-VKS.exe
        shell: pwsh
        run: |
          # Ensure GOPATH is set for this step too
          if (-not $env:GOPATH) {
            $env:GOPATH = Join-Path $env:USERPROFILE "go"
          }
          $wailsPath = Join-Path $env:GOPATH "bin\wails.exe"
          
          Write-Host "=== Method 1: Try wails build ==="
          Write-Host "wails path: $wailsPath"
          
          & $wailsPath build -platform windows/amd64 -clean -trimpath
          $wailsExitCode = $LASTEXITCODE
          Write-Host "Wails build exit code: $wailsExitCode"
          
          $exePath = "build/bin/BCY-VKS.exe"
          
          if (Test-Path $exePath) {
            $fileInfo = Get-Item $exePath
            $sizeBytes = $fileInfo.Length
            $sizeMB = $sizeBytes / 1048576
            $sizeMB = [MATH]::Round($sizeMB, 2)
            Write-Host "Wails build successful! Size: $sizeMB MB"
          } else {
            Write-Host "Wails build did not produce .exe, trying Method 2 (go build)..."
            
            $env:CGO_ENABLED = "1"
            New-Item -ItemType Directory -Path "build/bin" -Force | Out-Null
            
            go build -tags "desktop,production" -trimpath -o "build/bin/BCY-VKS.exe" .
            $goExitCode = $LASTEXITCODE
            Write-Host "go build exit code: $goExitCode"
            
            if (Test-Path $exePath) {
              $fileInfo = Get-Item $exePath
              $sizeBytes = $fileInfo.Length
              $sizeMB = $sizeBytes / 1048576
              $sizeMB = [MATH]::Round($sizeMB, 2)
              Write-Host "go build successful! Size: $sizeMB MB"
            } else {
              Write-Host "ERROR: Both methods failed"
              Write-Host "Listing build/ contents:"
              if (Test-Path build) {
                Get-ChildItem -Path build -Recurse -Force -ErrorAction SilentlyContinue | Format-Table FullName
              }
              exit 1
            }
          }
          
          Write-Host ""
          Write-Host "=== Final build/bin/ contents ==="
          Get-ChildItem -Path build/bin -Force -ErrorAction SilentlyContinue | Format-Table Name,Length

      - name: Verify embedded assets
        shell: pwsh
        run: |
          $exe = "build/bin/BCY-VKS.exe"
          if (Test-Path $exe) {
            $fileInfo = Get-Item $exe
            $sizeBytes = $fileInfo.Length
            $sizeMB = $sizeBytes / 1048576
            $sizeMB = [MATH]::Round($sizeMB, 2)
            Write-Host "File: $exe | Size: $sizeMB MB"
            
            $bytes = [System.IO.File]::ReadAllBytes($exe)
            $text = [System.Text.Encoding]::ASCII.GetString($bytes)
            if ($text -match "index.html") { Write-Host "OK: index.html embedded" } else { Write-Host "MISSING: index.html" }
            if ($text -match "style.css") { Write-Host "OK: style.css embedded" } else { Write-Host "MISSING: style.css" }
            if ($text -match "main.js") { Write-Host "OK: main.js embedded" } else { Write-Host "MISSING: main.js" }
            if ($text -match "logo-bcy") { Write-Host "OK: logo-bcy.png embedded" } else { Write-Host "MISSING: logo-bcy.png" }
            if ($text -match "crack_signatures") { Write-Host "OK: crack_signatures.txt embedded" } else { Write-Host "MISSING: crack_signatures.txt" }
            if ($text -match "cve_db") { Write-Host "OK: cve_db.csv embedded" } else { Write-Host "MISSING: cve_db.csv" }
            if ($text -match "badusb") { Write-Host "OK: badusb_vid_pid.txt embedded" } else { Write-Host "MISSING: badusb_vid_pid.txt" }
            if ($text -match "wails") { Write-Host "OK: Wails framework linked" } else { Write-Host "MISSING: Wails framework" }
          } else {
            Write-Host "ERROR: File NOT found: $exe"
          }

      - name: Upload BCY-VKS.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: BCY-VKS-exe
          path: build/bin/BCY-VKS.exe
          if-no-files-found: warn

  # ============================================================
  # JOB 2: Code signing with DigiCert Software Trust Manager
  # (optional - chỉ chạy khi enable DIGICERT_SIGNING secret)
  # Tham khao: https://github.com/digicert/code-signing-software-trust-action
  # ============================================================
  sign:
    name: Code Sign with DigiCert
    needs: build
    if: github.ref_type == 'tag' && vars.ENABLE_DIGICERT_SIGNING == 'true'
    runs-on: windows-latest
    environment: signing  # requires manual approval
    
    steps:
      - name: Download BCY-VKS.exe artifact
        uses: actions/download-artifact@v4
        with:
          name: BCY-VKS-exe
          path: ./build/bin
      
      - name: Setup DigiCert client cert
        shell: pwsh
        run: |
          $certBytes = [Convert]::FromBase64String($env:SM_CLIENT_CERT_B64)
          [IO.File]::WriteAllBytes("client.p12", $certBytes)
        env:
          SM_CLIENT_CERT_B64: ${{ secrets.SM_CLIENT_CERT_FILE_B64 }}
      
      - name: Code sign with DigiCert Software Trust Manager
        uses: digicert/code-signing-software-trust-action@v1
        with:
          mode: simple
          signing-cert: ${{ vars.SM_CERT_ALIAS }}
        env:
          SM_HOST: ${{ vars.SM_HOST }}
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_CLIENT_CERT_FILE: ./client.p12
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
      
      - name: Verify signature
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature -FilePath "build/bin/BCY-VKS.exe"
          Write-Host "Status: $($sig.Status)"
          Write-Host "Subject: $($sig.SignerCertificate.Subject)"
          Write-Host "Issuer:  $($sig.SignerCertificate.Issuer)"
      
      - name: Upload signed exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: BCY-VKS-signed
          path: build/bin/BCY-VKS.exe

  release:
    name: Create GitHub Release
    needs: [build, sign]
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && (needs.build.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed BCY-VKS.exe (preferred)
        uses: actions/download-artifact@v4
        with:
          name: BCY-VKS-signed
          path: ./release
        continue-on-error: true
      
      - name: Download unsigned BCY-VKS.exe (fallback)
        if: ${{ failure() }}
        uses: actions/download-artifact@v4
        with:
          name: BCY-VKS-exe
          path: ./release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: BCY-VKS ${{ github.ref_name }}
          body: |
            # BCY-VKS ${{ github.ref_name }}

            ## Download

            - **BCY-VKS.exe** - Production binary

            ## Install

            1. Download `BCY-VKS.exe`
            2. Right-click -> Run as Administrator
            3. Click "RA QUET TOAN BO"

            ## Legal notice

            Anti-Forensics feature is for licensed security exercises only.
          files: |
            release/BCY-VKS.exe
          draft: false
          prerelease: false
